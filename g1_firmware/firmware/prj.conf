# g1v0: scouter firmware for the G1 app core, protocol 5 (scouter_kit/g1_firmware/docs/VM.md).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.5.28+0"
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_NRF53_UPGRADE_NETWORK_CORE=y
CONFIG_ADD_MCUBOOT_MEDIATE_SIM_FLASH_DTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="G1CFW"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
# The GATT client below runs in this thread's callbacks.
CONFIG_BT_RX_STACK_SIZE=2560
# The iPhone notification relay (ancs.c): a client of the phone's ANCS, on the link the phone itself made. Its
# subscriptions never outlive a link, so nothing is restored at a reconnection.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_RESUBSCRIBE=n

CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
# The OTA sample turns on the zephyr-basic group with NVS settings: its only command erases the settings
# partition (every bond). Nothing uses it (flash.py, the asset store): off (0.5.58).
CONFIG_MCUMGR_GRP_ZBASIC=n

CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG_NUM_ENDPOINTS_PER_INSTANCE=2

# Hardware floating point: the LC3 encoder of the microphone (mic.c) and the IMU's angles.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Device power management only for the idle bisect's TWIM2 switch (idle.c, test builds); nothing suspends a device
# by itself (no CONFIG_PM).
CONFIG_PM_DEVICE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
# Panel SPIM4 is driven by panel.c directly (32 MHz, as stock), not by the Zephyr SPI driver.
CONFIG_SPI=n
CONFIG_FLASH=y
# The asset store's put verifies its read-back with SHA-256 (assets.c).
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256=y
CONFIG_CRC=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_PRINTK=y
# The console UART has no receiver (app.overlay disable-rx): Zephyr's UARTE driver then runs it in
# low-power mode, off between transmissions; an enabled receiver kept the HF clock running for good.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
# CPU load for the POWER telemetry (idle vs busy cycles)
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y

# Security (docs/protocol.md §: bonding mirrors stock). LE Secure Connections, Just Works
# (NoInputNoOutput), bonds in the settings partition. The write gate is enforced in the handlers
# (in-case VBUS bypasses it), so the GATT permissions stay plain.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
# Pairing must create a bond (a pairing request without the bonding flag is rejected), so an
# encrypted link out of the case always means a bonded peer.
CONFIG_BT_BONDING_REQUIRED=y
CONFIG_BT_MAX_PAIRED=3
# A new bond (only possible in the case) replaces the oldest one when all 3 are used; otherwise no new
# host could ever bond (g1v0 has no unpair command).
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Store a bond's aging counter whenever another bond becomes the most recently used (each change of host),
# so "oldest" means least recently used across reboots too, not only within one boot (0.5.58).
CONFIG_BT_KEYS_SAVE_AGING_COUNTER_ON_PAIRING=y
# A host that lost its bond may pair again (in the case) over the arm's old Just Works bond for its
# address; Zephyr refuses that by default. Out of the case pairing is still refused (not bondable).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
